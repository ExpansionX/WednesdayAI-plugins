name: CI
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, converted_to_draft, ready_for_review]

# Converting a PR to draft starts a no-op run that cancels the in-flight one.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm i -g pnpm@10.23.0
      - run: pnpm install --frozen-lockfile
      - name: Validate manifests
        run: node scripts/validate-manifest.mjs
      - name: Generate catalog (drift check)
        run: node scripts/generate-catalog.mjs --check
      - name: Validate skills
        run: node scripts/validate-skills.mjs
      - name: Check lazy imports
        run: node scripts/check-extension-lazy-imports.mjs
      - name: Test scripts
        run: node --test scripts/
      - name: Typecheck plugins
        run: |
          for d in plugins/*/; do
            if [ -f "$d/package.json" ] && [ -f "$d/tsconfig.json" ]; then
              (cd "$d" && npx tsc --noEmit) || exit 1
            fi
          done
      - name: Lint
        run: pnpm lint
